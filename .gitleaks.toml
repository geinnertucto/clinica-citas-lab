# Reglas de Gitleaks: las de siempre, más las claves propias de este proyecto.
[extend]
useDefault = true

[[rules]]
id = "pasarela-andina"
description = "Clave de la Pasarela Andina"
regex = '''pa_live_[A-Za-z0-9]{32}'''
keywords = ["pa_live_"]

[[rules]]
id = "registro-fabrica"
description = "Token del registro de paquetes de la fábrica"
regex = '''frb_[A-Za-z0-9]{36}'''
keywords = ["frb_"]
